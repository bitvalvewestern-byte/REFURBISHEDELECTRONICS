<!DOCTYPE html>
<html lang="en-KE">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Product details | Nairobi Computer Shop</title>
<link rel="stylesheet" href="/css/styles.css">
</head>
<body>
<a class="skip-link" href="#main">Skip to main content</a>
<header id="site-header"></header>

<main id="main">
  <div class="container">
    <nav aria-label="Breadcrumb" class="muted" style="margin-bottom:1rem">
      <a href="/index.html">Home</a> / <a href="/products.html">Products</a>
      <span id="crumb-cat"></span>
    </nav>

    <div id="detail-alert"></div>
    <div id="detail-host">
      <div class="product-detail">
        <div class="gallery skeleton" style="min-height:320px"></div>
        <div>
          <div class="skeleton" style="height:24px;width:70%;margin-bottom:1rem"></div>
          <div class="skeleton" style="height:34px;width:40%;margin-bottom:1rem"></div>
          <div class="skeleton" style="height:14px;width:100%"></div>
          <div class="skeleton" style="height:14px;width:90%;margin-top:.5rem"></div>
        </div>
      </div>
    </div>

    <section aria-labelledby="related-heading" style="margin-top:2.5rem">
      <div class="section-head"><h2 id="related-heading">Related products</h2></div>
      <div id="related"></div>
    </section>
  </div>
</main>

<footer id="site-footer"></footer>
<script type="module" src="/js/product.js"></script>
</body>
</html>
